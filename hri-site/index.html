<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hospital-based surveillance and Cohort study of heat related illnesses in India</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
  <div id="bubbles" aria-hidden="true"></div>
  <div id="sun" class="sun" aria-hidden="true"></div>
  <div class="hero-in">
    <svg class="thermo" viewBox="0 0 60 140" aria-hidden="true">
      <rect x="20" y="4" width="20" height="104" rx="10" fill="#fff" fill-opacity=".95"/>
      <circle cx="30" cy="116" r="21" fill="#fff" fill-opacity=".95"/>
      <circle cx="30" cy="116" r="13" fill="#e03a2f"/>
      <rect class="mercury" x="26" y="16" width="8" height="100" rx="4" fill="#e03a2f"/>
      <g stroke="#b9c2c9" stroke-width="2" stroke-linecap="round"><line x1="44" y1="24" x2="52" y2="24"/><line x1="44" y1="44" x2="52" y2="44"/><line x1="44" y1="64" x2="52" y2="64"/><line x1="44" y1="84" x2="52" y2="84"/></g>
    </svg>
    <h1>Hospital-based surveillance and Cohort study of heat related illnesses in India</h1>
  </div>
  <svg class="waves" viewBox="0 0 2880 70" preserveAspectRatio="none" aria-hidden="true">
    <path class="w1" fill="#fff7ec" fill-opacity=".55" d="M0 35 Q180 0 360 35 T720 35 T1080 35 T1440 35 T1800 35 T2160 35 T2520 35 T2880 35 V70 H0Z"/>
    <path class="w2" fill="#fff7ec" d="M0 48 Q180 18 360 48 T720 48 T1080 48 T1440 48 T1800 48 T2160 48 T2520 48 T2880 48 V70 H0Z"/>
  </svg>
</header>

<main class="wrap" id="app" aria-live="polite">
  <p class="empty">Loading…</p>
</main>

<footer>
  <span class="f-ico"><svg id="fsun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"></svg>Developed by HRI Team, ICMR NIE</span>
</footer>

<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

/* ---- icons (24x24 line icons) ---- */
const svg = (inner, cls="ico") => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
const ICON = {
  target: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
  flag: '<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/>',
  heart: '<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/><polyline points="7 12 9.5 12 11 9 13 15 14.5 12 17 12"/>',
  wind: '<path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/>',
  shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/>',
  bell: '<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',
  login: '<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/>',
  pin: '<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',
  home: '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
  list: '<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/>',
  chev: '<polyline points="6 9 12 15 18 9"/>',
  tick: '<polyline points="5 12 10 17 19 7"/>',
  users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  user: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
  pulse: '<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>',
  clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>',
  thermo: '<path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>'
};
const badgeIco = (name) => `<span class="ico-badge">${svg(ICON[name],"")}</span>`;
const COMP = {
  epi:           {icon:"heart",  c1:"#e03a2f", c2:"#f58220"},
  climate:       {icon:"wind",   c1:"#1d6fb8", c2:"#13a89e"},
  interventions: {icon:"shield", c1:"#12794a", c2:"#13a89e"},
  ews:           {icon:"bell",   c1:"#b45309", c2:"#d97706"}
};

/* ---- decorative hero bits ---- */
document.getElementById("fsun").innerHTML = ICON.sun;
document.getElementById("sun").innerHTML = (() => {
  let rays = ""; for (let i=0;i<16;i++) rays += `<line x1="100" y1="16" x2="100" y2="${i%2?30:8}" transform="rotate(${i*22.5} 100 100)"/>`;
  return `<svg viewBox="0 0 200 200"><g stroke="#fff3b0" stroke-width="6" stroke-linecap="round">${rays}</g>
    <circle class="core" cx="100" cy="100" r="46" fill="#fff3b0" fill-opacity=".9"/><circle cx="100" cy="100" r="62" fill="none" stroke="#fff3b0" stroke-opacity=".5" stroke-width="3"/></svg>`;
})();
document.getElementById("bubbles").innerHTML = Array.from({length:14},(_,i)=>{
  const s = 8 + Math.random()*22;
  return `<span class="bubble" style="left:${Math.random()*100}%;width:${s}px;height:${s}px;animation-duration:${6+Math.random()*8}s;animation-delay:${-Math.random()*10}s"></span>`;
}).join("");

/* ---- helpers ---- */
const fmtMonth = v => /^\d{4}-\d{2}$/.test(v||"") ? `<span class="date-chip">${svg(ICON.calendar,"")}${MONTHS[+v.slice(5)-1]} ${v.slice(0,4)}</span>` : "—";
const badge = s => {
  const cls = s === "Completed" ? "completed" : s === "Not Completed" ? "not" : "proc";
  return `<span class="badge ${cls}">${esc(s)}</span>`;
};
const people = (list, empty) => list.length ? list.map(p=>`<span class="chip">${esc(p.name)}</span>`).join("") : `<span class="d">${empty}</span>`;
const siteTags = x => (x.sites && x.sites.length) ? `<span class="site-tags">${x.sites.map(s=>`<span class="site-tag">${svg(ICON.pin,"")}${esc(s)}</span>`).join("")}</span>` : "";
const subBadge = s => `<span class="badge ${s === "Completed" ? "completed" : "proc"}">${esc(s)}</span>`;
const subIco = s => s === "Completed" ? `<span class="sp-ico done">${svg(ICON.tick,"")}</span>` : `<span class="sp-ico going"></span>`;
const subPanel = (a, id) => `<div class="sp-wrap" id="${id}"><div class="sp-inner">${
  (a.subs && a.subs.length)
    ? `<ul class="sp-list">${a.subs.map((x,i)=>`<li style="--i:${i}" class="${x.status==="Completed"?"is-done":"is-going"}">${subIco(x.status)}<span class="sp-name">${esc(x.name)}${siteTags(x)}</span>${subBadge(x.status)}</li>`).join("")}</ul>`
    : `<p class="empty">No subprocess added yet.</p>`}</div></div>`;
const subBtn = (a, id) => `<button type="button" class="sub-btn" data-sp="${id}" aria-expanded="false" aria-controls="${id}">${svg(ICON.list,"")}Subprocess<span class="cnt">${(a.subs||[]).length}</span>${svg(ICON.chev,"")}</button>`;

function table(headers, rows, emptyText){
  if(!rows.length) return `<p class="empty">${emptyText}</p>`;
  return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th class="${h.cls||""}">${h.t}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
}

/* ---- Activities - Site view ---- */
let DATA = null, VIEW = "home", SITE = null;
const siteWork = (d, site) => d.components.map((c,i)=>({c,i,acts:c.activities.map((a,ai)=>({a,ai,subs:(a.subs||[]).filter(x=>(x.sites||[]).includes(site))})).filter(x=>x.subs.length)})).filter(x=>x.acts.length);
const siteCount = (d, site) => siteWork(d, site).reduce((n,w)=>n+w.acts.reduce((m,x)=>m+x.subs.length,0),0);

function siteHtml(d, site){
  const work = siteWork(d, site);
  const all = work.flatMap(w=>w.acts.flatMap(x=>x.subs));
  const done = all.filter(x=>x.status==="Completed").length;
  const pct = all.length ? Math.round(done/all.length*100) : 0;
  const head = `<div class="site-head"><span class="ico-badge">${svg(ICON.pin,"")}</span><div><h2>${esc(site)}</h2>
    <p>${all.length ? `${work.length} component${work.length>1?"s":""} · ${all.length} subprocess${all.length>1?"es":""} · ${done} completed` : "Nothing assigned to this site yet"}</p></div>
    ${all.length ? `<div class="progress site-prog"><div class="track"><div class="fill" style="width:${pct}%"></div></div><span>${pct}%</span></div>` : ""}</div>`;
  if (!work.length) return head + `<p class="empty site-empty">No subprocess has been assigned to ${esc(site)} yet.</p>`;
  return head + work.map(({c,i,acts})=>{
    const t = COMP[c.id] || COMP.epi;
    return `<section class="component" style="--c1:${t.c1};--c2:${t.c2}">
      <header>${badgeIco(t.icon)}<h3><span class="num">${i+1}.</span> ${esc(c.title)}</h3></header>
      <div class="body">${acts.map(({a,ai,subs})=>`
        <div class="site-act">
          <div class="site-act-h"><div class="act-name"><span class="an">${ai+1}</span><span>${esc(a.activity)}</span></div>${badge(a.status)}</div>
          <div class="sp-wrap open"><div class="sp-inner"><ul class="sp-list">${subs.map((x,k)=>`<li style="--i:${k}" class="${x.status==="Completed"?"is-done":"is-going"}">${subIco(x.status)}<span class="sp-name">${esc(x.name)}</span>${subBadge(x.status)}</li>`).join("")}</ul></div></div>
        </div>`).join("")}</div></section>`;
  }).join("");
}

function showView(view, site, push){
  VIEW = view;
  if (site) SITE = site;
  const home = document.getElementById("view-home"), sites = document.getElementById("view-sites");
  if (!home || !sites) return;
  home.hidden = view !== "home"; sites.hidden = view !== "sites";
  document.querySelectorAll(".seg button").forEach(b=>{ const on = b.dataset.view === view; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
  if (view === "sites") {
    const d = DATA;
    if (!SITE || !d.sites.includes(SITE)) SITE = d.sites[0];
    document.querySelectorAll(".site-btn").forEach(b=>{ const on = b.dataset.site === SITE; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
    const out = document.getElementById("site-out");
    out.innerHTML = siteHtml(d, SITE);
    out.classList.remove("swap"); void out.offsetWidth; out.classList.add("swap");
  }
  if (push) { try { history.replaceState(null, "", view === "sites" ? "#sites/" + encodeURIComponent(SITE) : "#home"); } catch(e){} }
}

function render(d){
  DATA = d;
  const comps = d.components.map((c,i) => {
    const t = COMP[c.id] || COMP.epi;
    const done = c.activities.filter(a=>a.status==="Completed").length, total = c.activities.length;
    const pct = total ? Math.round(done/total*100) : 0;
    const prog = total ? `<div class="progress"><span>${done} of ${total} completed</span><div class="track"><div class="fill" data-w="${pct}"></div></div><span>${pct}%</span></div>` : "";
    const acts = table(
      [{t:"Project activities"},{t:"Status"}],
      c.activities.map((a,ai)=>{ const id = `sp-${c.id}-${a.id}`; return `<tr><td><div class="act-name"><span class="an">${ai+1}</span><span>${esc(a.activity)}</span></div>${subPanel(a,id)}</td><td><div class="st-wrap">${badge(a.status)}${subBtn(a,id)}</div></td></tr>`; }),
      "No project activities added yet.");
    const up = table(
      [{t:"Upcoming activities"},{t:"End date",cls:"date"}],
      c.upcoming.map(a=>`<tr><td>${esc(a.activity)}</td><td class="date">${fmtMonth(a.endDate)}</td></tr>`),
      "No upcoming activities added yet.");
    return `<section class="component reveal" style="--c1:${t.c1};--c2:${t.c2};transition-delay:${i*60}ms" aria-label="${esc(c.title)}">
      <header>${badgeIco(t.icon)}<h3><span class="num">${i+1}.</span> ${esc(c.title)}</h3></header>
      <div class="body">
        <div class="invest">${svg(ICON.user,"")}<span class="k">Investigators in-charge</span>${people(c.investigators,"Not yet assigned")}</div>
        <div class="invest team">${svg(ICON.users,"")}<span class="k">Team members</span>${people(c.members,"Not yet added")}</div>
        ${prog}
        <div class="tables">
          <div><p class="tbl-title">${svg(ICON.pulse,"small-ico")}Project activities</p>${acts}</div>
          <div class="vdiv" aria-hidden="true"></div>
          <div class="up-col"><p class="tbl-title">${svg(ICON.clock,"small-ico")}Upcoming activities</p>${up}</div>
        </div>
      </div></section>`;
  }).join("");

  const pubs = table(
    [{t:"Activity"},{t:"Status"},{t:"End date",cls:"date"}],
    d.publications.map(a=>`<tr><td>${esc(a.activity)}</td><td>${badge(a.status)}</td><td class="date">${fmtMonth(a.endDate)}</td></tr>`),
    "No activities added yet.");

  const siteBtns = d.sites.map(s=>{ const n = siteCount(d, s); return `<button type="button" class="site-btn" data-site="${esc(s)}" aria-pressed="false">${svg(ICON.pin,"")}${esc(s)}<span class="cnt${n?"":" zero"}">${n}</span></button>`; }).join("");

  document.getElementById("app").innerHTML = `
    <div class="viewbar"><div class="seg" role="group" aria-label="Choose view">
      <button type="button" class="on" data-view="home" aria-pressed="true">${svg(ICON.home,"")}Home</button>
      <button type="button" data-view="sites" aria-pressed="false">${svg(ICON.pin,"")}Activities - Site</button>
      <a class="seg-login" href="admin.html">${svg(ICON.login,"")}Login</a>
    </div></div>
    <div id="view-home">
    <div class="split">
      <section class="panel aim reveal"><h2>${badgeIco("target")}Aim</h2><p>${esc(d.aim)}</p></section>
      <section class="panel obj reveal" style="transition-delay:80ms"><h2>${badgeIco("flag")}Objective</h2>
        <div class="obj-scroll" tabindex="0" role="region" aria-label="Objective details">
          <h3>${svg(ICON.thermo,"small-ico")}a) Primary</h3><p>${esc(d.objectives.primary)}</p>
          <h3>${svg(ICON.thermo,"small-ico")}b) Secondary</h3><p>${esc(d.objectives.secondary)}</p>
        </div>
      </section>
    </div>
    <h2 class="section-title reveal">${badgeIco("thermo")}Components</h2>
    ${comps}
    <h2 class="section-title reveal">${badgeIco("file")}Other activities for publication</h2>
    <div class="panel reveal">${pubs}</div>
    </div>
    <div id="view-sites" hidden>
      <h2 class="section-title">${badgeIco("pin")}Site-wise activities</h2>
      <div class="site-btns" role="group" aria-label="Choose a site">${siteBtns}</div>
      <div id="site-out"></div>
    </div>`;

  const els = document.querySelectorAll(".reveal");
  if (!("IntersectionObserver" in window)) els.forEach(e=>{e.classList.add("in");fillBars(e);});
  else {
    const io = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ e.target.classList.add("in"); fillBars(e.target); io.unobserve(e.target);} }), {threshold:.12});
    els.forEach(e => io.observe(e));
  }
  const m = location.hash.match(/^#sites(?:\/(.+))?$/);
  if (m) showView("sites", m[1] ? decodeURIComponent(m[1]) : null, false); else showView(VIEW, null, false);
}
function fillBars(root){ root.querySelectorAll(".fill").forEach(f => f.style.width = f.dataset.w + "%"); }

document.getElementById("app").addEventListener("click", e => {
  const sg = e.target.closest(".seg button");
  if (sg) { showView(sg.dataset.view, null, true); return; }
  const sb = e.target.closest(".site-btn");
  if (sb) { showView("sites", sb.dataset.site, true); return; }
  const b = e.target.closest(".sub-btn"); if (!b) return;
  const w = document.getElementById(b.dataset.sp); if (!w) return;
  const open = w.classList.toggle("open");
  b.classList.toggle("open", open);
  b.setAttribute("aria-expanded", open);
});

window.addEventListener("hashchange", () => {
  if (!DATA) return;
  const m = location.hash.match(/^#sites(?:\/(.+))?$/);
  if (m) showView("sites", m[1] ? decodeURIComponent(m[1]) : null, false); else showView("home", null, false);
});

try{
  const m = JSON.parse(sessionStorage.getItem("hri_me") || "null");
  const L = {admin:"Admin",investigator:"Investigator",member:"Team member"};
  if (m && m.name) { const a = document.createElement("a"); a.className = "who-chip"; a.href = "admin.html"; a.textContent = `${m.name} · ${L[m.role]||""}`; document.querySelector(".hero").appendChild(a); }
}catch(e){}

fetch("/api/content").then(r => { if(!r.ok) throw 0; return r.json(); })
  .then(render)
  .catch(() => { document.getElementById("app").innerHTML = '<p class="empty">Could not load the project details. Please refresh the page.</p>'; });
</script>
</body>
</html>
