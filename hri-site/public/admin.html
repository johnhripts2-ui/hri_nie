<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin – HRI project site</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.login{max-width:420px;margin:40px auto}
label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
input[type=text],input[type=password],input[type=month],textarea,select{
  width:100%;font:inherit;padding:8px 10px;border:1px solid #aab8bd;border-radius:4px;background:#fff;color:var(--ink)}
input:disabled{background:#f1ece4;color:var(--muted)}
textarea{min-height:90px;resize:vertical}
button{font:inherit;cursor:pointer;border-radius:4px;border:1px solid var(--deep2);padding:8px 16px;background:#fff;color:var(--deep2);font-weight:600}
button.primary{background:var(--deep2);color:#fff}
button.danger{border-color:var(--not);color:var(--not);padding:6px 10px}
button.small{padding:6px 12px;font-size:.9rem}
button:disabled{opacity:.6;cursor:not-allowed}
.msg{margin-top:10px;font-weight:600}
.msg.err{color:var(--not)} .msg.ok{color:var(--done)}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 18px;margin-bottom:18px}
.profile{display:flex;align-items:center;gap:12px}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1.2rem;color:#fff;background:linear-gradient(135deg,#f58220,#e03a2f);flex:0 0 auto}
.pinfo{display:flex;flex-direction:column;line-height:1.3}
.role{display:inline-block;padding:3px 12px;border-radius:99px;font-size:.82rem;font-weight:800}
.role-admin{background:#ffe0dc;color:#b3261e}
.role-investigator{background:#d9ecfb;color:#1d6fb8}
.role-member{background:#d9f5e5;color:#12794a}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button[aria-selected=true]{background:var(--deep2);color:#fff}
.savebar{position:sticky;bottom:0;background:var(--card);border-top:2px solid var(--deep2);padding:12px 18px;margin:24px -4px 0;display:flex;gap:14px;align-items:center;flex-wrap:wrap;z-index:5}
.row{display:grid;gap:8px;align-items:start;margin-bottom:8px}
.row.act{grid-template-columns:1fr 170px 44px}
.row.up{grid-template-columns:1fr 170px 44px}
.row.pub{grid-template-columns:1fr 170px 170px 44px}
.row.sub{grid-template-columns:1fr 170px 44px}
.row.name{grid-template-columns:1fr 44px}
.row.head{font-weight:600;font-size:.85rem;color:var(--muted)}
.actcard{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:#fffaf2}
.subs-edit{margin:2px 0 8px 22px;border-left:3px solid #f3c48a;padding-left:12px}
.subs-edit .lbl{font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grp{margin-top:18px}
.grp h4{margin:0 0 8px;color:var(--deep)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chk{display:flex;gap:8px;align-items:center;font-weight:600;margin:6px 0}
.chk input{width:auto}
.log{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 18px;margin-bottom:10px}
.log .who{font-weight:600}.log .when{color:var(--muted);font-size:.88rem}
.log ul{margin:6px 0 0;padding-left:20px}
.hint{color:var(--muted);font-size:.88rem;margin:4px 0 0}
.panel+.panel{margin-top:18px}
@media(max-width:820px){.two,.row.act,.row.up,.row.pub,.row.sub{grid-template-columns:1fr}.row.head{display:none}.subs-edit{margin-left:6px}}
</style>
</head>
<body>
<div class="topbar"><h1>Admin – project details</h1></div>
<main class="wrap" id="root"></main>
<footer><span>Developed by HRI Team, ICMR NIE</span><a href="index.html">Back to website</a></footer>

<script>
const STATUSES = ["Completed","On Process","Not Completed"];
const SUB_STATUSES = ["Ongoing","Completed"];
const ROLE_LABEL = {admin:"Admin", investigator:"Investigator", member:"Team member"};
const COMP_COLORS = {epi:["#e03a2f","#f58220"], climate:["#1d6fb8","#13a89e"], interventions:["#12794a","#13a89e"], ews:["#b45309","#d97706"]};
const root = document.getElementById("root");
let token = sessionStorage.getItem("hri_token");
let me = null; try { me = JSON.parse(sessionStorage.getItem("hri_me") || "null"); } catch(e) {}
let data = null, users = [], tab = "edit", editing = null;

const rid = () => Math.random().toString(36).slice(2,10);
function h(tag, props = {}, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(props)) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k,"");
    else if (v !== false && v != null) el.setAttribute(k,v);
  }
  for (const kid of kids.flat()) if (kid != null) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
}

async function api(path, opts = {}){
  const res = await fetch(path, {...opts, headers:{"content-type":"application/json", ...(token?{authorization:"Bearer "+token}:{}), ...opts.headers}});
  const body = await res.json().catch(()=>({}));
  if (res.status === 401 && token) { logout(body.error); throw new Error(body.error || "Session expired."); }
  if (!res.ok) throw new Error(body.error || "Something went wrong.");
  return body;
}

function logout(msg){ sessionStorage.clear(); token = me = data = null; tab = "edit"; editing = null; showLogin(typeof msg === "string" ? msg : ""); }
function keepScroll(fn){ const y = scrollY; fn(); scrollTo(0,y); }
const derive = a => a.subs.length > 0 && a.subs.every(x => x.status === "Completed") ? "Completed" : "On Process";
const isAdmin = () => me && me.role === "admin";

/* ---------- Login ---------- */
function showLogin(msg){
  const err = h("p",{class:"msg err",role:"alert"}, msg||"");
  const un = h("input",{type:"text",id:"un",autocomplete:"username",autocapitalize:"off",required:true});
  const pw = h("input",{type:"password",id:"pw",autocomplete:"current-password",required:true});
  const nm = h("input",{type:"text",id:"nm",autocomplete:"name"});
  const nmWrap = h("div",{style:"display:none"},
    h("label",{for:"nm"},"Your name (admin only – recorded in the activity log)"), nm);
  un.addEventListener("input",()=>{ nmWrap.style.display = un.value.trim().toLowerCase()==="admin" ? "block" : "none"; });
  const btn = h("button",{class:"primary",type:"submit"},"Log in");
  const form = h("form",{class:"panel login", onsubmit: async e => {
    e.preventDefault(); err.textContent = ""; btn.disabled = true;
    try{
      const r = await api("/api/admin/login",{method:"POST",body:JSON.stringify({username:un.value,password:pw.value,name:nm.value})});
      token = r.token; me = r.profile;
      sessionStorage.setItem("hri_token",token); sessionStorage.setItem("hri_me",JSON.stringify(me));
      await load();
    }catch(ex){ err.textContent = ex.message; btn.disabled = false; }
  }},
    h("h2",{},"Login"),
    h("p",{class:"hint"},"Admin, investigators and team members log in here. Your name is recorded with every change you make."),
    h("label",{for:"un"},"Login ID"), un,
    h("label",{for:"pw"},"Password"), pw,
    nmWrap,
    h("div",{style:"margin-top:16px"}, btn), err);
  root.replaceChildren(form); un.focus();
}

/* ---------- Load + frame ---------- */
async function load(){
  data = await (await fetch("/api/content",{cache:"no-store"})).json();
  render();
}

function assignedText(){
  return data.components.map((c,i)=>({c,i})).filter(x=>me.components.includes(x.c.id)).map(x=>`${x.i+1}. ${x.c.title}`).join(" · ") || "no component assigned yet";
}

function render(){
  const tabs = [["edit","Edit content"]];
  if (isAdmin()) tabs.push(["users","Logins"],["log","Activity log"]);
  const bar = h("div",{class:"bar"},
    h("div",{class:"profile"},
      h("div",{class:"avatar","aria-hidden":"true"}, (me.name||"?").slice(0,1).toUpperCase()),
      h("div",{class:"pinfo"},
        h("strong",{},me.name),
        h("span",{class:"hint"},"Login ID: "+me.username),
        isAdmin() ? null : h("span",{class:"hint"},"Assigned: "+assignedText())),
      h("span",{class:"role role-"+me.role}, ROLE_LABEL[me.role])),
    h("div",{class:"tabs",role:"tablist"}, tabs.map(([k,l])=>
      h("button",{role:"tab","aria-selected":tab===k,onclick:()=>{tab=k;editing=null;render();}},l))),
    h("button",{onclick:()=>logout()},"Log out"));
  root.replaceChildren(bar, tab==="edit" ? editor() : h("div",{id:"tabbox"},"Loading…"));
  if (tab==="users") showUsers();
  if (tab==="log") showLog();
}

/* ---------- Field helpers ---------- */
function textField(label, get, set, multiline, disabled){
  const id = "f"+rid();
  const input = multiline ? h("textarea",{id}) : h("input",{type:"text",id,disabled:!!disabled});
  input.value = get();
  input.addEventListener("input",()=>set(input.value));
  return h("div",{}, h("label",{for:id},label), input);
}
function selectOf(options, row, key, label, onchange){
  const sel = h("select",{"aria-label":label}, options.map(s=>h("option",{value:s},s)));
  sel.value = row[key] || options[0];
  sel.addEventListener("change",()=>{ row[key] = sel.value; if(onchange) onchange(); });
  return sel;
}
function monthInput(row){
  const m = h("input",{type:"month","aria-label":"End date (month and year)"});
  m.value = row.endDate || "";
  m.addEventListener("input",()=>row.endDate = m.value);
  return m;
}
function textInput(row, key, label){
  const i = h("input",{type:"text","aria-label":label,placeholder:label});
  i.value = row[key] || "";
  i.addEventListener("input",()=>row[key] = i.value);
  return i;
}
function delBtn(list,row,after){
  return h("button",{class:"danger",type:"button","aria-label":"Delete this row",onclick:()=>{ list.splice(list.indexOf(row),1); if(after) after(); keepScroll(render); }},"✕");
}
function addBtn(label, fn){
  return h("button",{class:"small",type:"button",onclick:()=>{ fn(); keepScroll(render); }},label);
}
const statusBadge = s => h("span",{class:"badge "+(s==="Completed"?"completed":"proc")}, s);

// Admin edits names; others just see them.
function nameList(list, title, placeholder, addLabel, editable){
  const g = h("div",{class:"grp"}, h("h4",{},title));
  if (!editable) {
    g.append(list.length ? h("div",{class:"chips"}, list.map(r=>h("span",{class:"chip"},r.name))) : h("p",{class:"hint"},"None yet."));
    return g;
  }
  list.forEach(r=>g.append(h("div",{class:"row name"}, textInput(r,"name",placeholder), delBtn(list,r))));
  g.append(addBtn(addLabel,()=>list.push({id:rid(),name:""})));
  return g;
}

/* ---------- Editor ---------- */
function editor(){
  const admin = isAdmin();
  const wrap = h("div");

  if (admin) {
    wrap.append(h("div",{class:"panel"},
      h("h2",{},"Aim and objective"),
      textField("Aim",()=>data.aim,v=>data.aim=v,true),
      textField("a) Primary objective",()=>data.objectives.primary,v=>data.objectives.primary=v,true),
      textField("b) Secondary objective",()=>data.objectives.secondary,v=>data.objectives.secondary=v,true)));
  } else {
    wrap.append(h("div",{class:"panel"},
      h("p",{},"You can add and edit project activities, subprocesses and upcoming activities for your assigned components, and all of “Other activities for publication”. Aim, objectives, investigators and team members are changed by the admin.")));
  }

  wrap.append(h("h2",{class:"section-title"},"Components"));
  let shown = 0;
  data.components.forEach((c,i)=>{
    if (!admin && !me.components.includes(c.id)) return;
    shown++;
    const [c1,c2] = COMP_COLORS[c.id] || [];
    const p = h("section",{class:"component",style:c1?`--c1:${c1};--c2:${c2}`:null},
      h("header",{},h("h3",{},`${i+1}. ${c.title}`)));
    const body = h("div",{class:"body"});

    body.append(h("div",{class:"two"},
      nameList(c.investigators,"Investigators in-charge","Investigator name","+ Add investigator",admin),
      nameList(c.members,"Team members","Team member name","+ Add team member",admin)));

    // Project activities, each with subprocesses
    const g1 = h("div",{class:"grp"}, h("h4",{},"Project activities"),
      h("p",{class:"hint"},"An activity shows “Completed” only when it has subprocesses and all of them are completed; otherwise it shows “On Process”."));
    c.activities.forEach(a=>{
      a.subs = a.subs || [];
      const card = h("div",{class:"actcard"});
      card.append(h("div",{class:"row act"}, textInput(a,"activity","Project activity"), statusBadge(derive(a)), delBtn(c.activities,a)));
      const subs = h("div",{class:"subs-edit"}, h("div",{class:"lbl"},"Subprocess"));
      a.subs.forEach(sp=>subs.append(h("div",{class:"row sub"},
        textInput(sp,"name","Subprocess"),
        selectOf(SUB_STATUSES,sp,"status","Subprocess status",()=>{a.status=derive(a);keepScroll(render);}),
        delBtn(a.subs,sp))));
      subs.append(addBtn("+ Subprocess",()=>a.subs.push({id:rid(),name:"",status:"Ongoing"})));
      card.append(subs);
      g1.append(card);
    });
    g1.append(addBtn("+ Add project activity",()=>c.activities.push({id:rid(),activity:"",subs:[],status:"On Process"})));

    const g2 = h("div",{class:"grp"}, h("h4",{},"Upcoming activities and end date"));
    c.upcoming.forEach(r=>g2.append(h("div",{class:"row up"},textInput(r,"activity","Upcoming activity"),monthInput(r),delBtn(c.upcoming,r))));
    g2.append(addBtn("+ Add upcoming activity",()=>c.upcoming.push({id:rid(),activity:"",endDate:""})));

    body.append(g1,g2); p.append(body); wrap.append(p);
  });
  if (!shown) wrap.append(h("div",{class:"panel"},h("p",{class:"empty"},"No component has been assigned to you yet. Please ask the admin.")));

  const pub = h("div",{class:"panel"});
  data.publications.forEach(r=>pub.append(h("div",{class:"row pub"},
    textInput(r,"activity","Activity"), selectOf(STATUSES,r,"status","Status"), monthInput(r), delBtn(data.publications,r))));
  pub.append(addBtn("+ Add activity",()=>data.publications.push({id:rid(),activity:"",status:"On Process",endDate:""})));
  wrap.append(h("h2",{class:"section-title"},"Other activities for publication"), pub);

  const msg = h("span",{class:"msg",role:"status"});
  const save = h("button",{class:"primary",onclick: async ()=>{
    save.disabled = true; msg.className="msg"; msg.textContent="Saving…";
    try{
      const r = await api("/api/admin/save",{method:"POST",body:JSON.stringify({data})});
      data = r.data;
      const text = r.changes.length ? `Saved. ${r.changes.length} change(s) recorded under your name.` : "No changes to save.";
      render(); // refresh (rows left blank are dropped on save)
      const m = document.querySelector(".savebar .msg"); if(m){m.className="msg ok";m.textContent=text;}
    }catch(ex){ msg.className="msg err"; msg.textContent = ex.message; save.disabled=false; }
  }},"Save changes");
  wrap.append(h("div",{class:"savebar"},save,msg,h("span",{class:"hint"},"Rows with an empty name are not saved.")));
  return wrap;
}

/* ---------- Logins (admin only) ---------- */
async function showUsers(){
  const box = document.getElementById("tabbox");
  try{ users = (await api("/api/admin/users")).users; }
  catch(ex){ box.replaceChildren(h("p",{class:"msg err"},ex.message)); return; }
  drawUsers(box);
}

function drawUsers(box){
  const list = h("div",{class:"panel"},
    h("h2",{},"Logins for investigators and team members"),
    h("p",{class:"hint"},"Create a login for each person and choose the components they may edit. The admin login uses login ID “admin” with the ADMIN_PASSWORD set in Netlify."));
  if (!users.length) list.append(h("p",{class:"empty"},"No logins created yet."));
  else {
    const rowsEl = users.map(u=>h("tr",{},
      h("td",{},u.name), h("td",{},u.username),
      h("td",{},h("span",{class:"role role-"+u.role},ROLE_LABEL[u.role])),
      h("td",{}, u.components.map(id=>{const i=data.components.findIndex(c=>c.id===id);return i>=0?String(i+1):"";}).join(", ") || "—"),
      h("td",{}, h("button",{class:"small",type:"button",onclick:()=>{editing={...u,components:[...u.components],password:""};drawUsers(box);}},"Edit"), " ",
        h("button",{class:"danger",type:"button",onclick:async()=>{
          if(!confirm(`Delete the login for ${u.name}?`)) return;
          try{ users=(await api("/api/admin/users",{method:"POST",body:JSON.stringify({action:"delete",id:u.id})})).users; editing=null; drawUsers(box);}
          catch(ex){alert(ex.message);} }},"Delete"))));
    list.append(h("div",{class:"tablewrap"},h("table",{},
      h("thead",{},h("tr",{},["Name","Login ID","Role","Components","" ].map(t=>h("th",{},t)))),
      h("tbody",{},rowsEl))));
  }
  list.append(h("div",{style:"margin-top:14px"},h("button",{class:"primary",type:"button",onclick:()=>{editing={id:"",name:"",username:"",role:"investigator",components:[],password:""};drawUsers(box);}},"+ Add login")));
  box.replaceChildren(list, ...(editing ? [userForm(box)] : []));
}

function userForm(box){
  const u = editing, isNew = !u.id;
  const err = h("p",{class:"msg",role:"status"});
  const role = h("select",{id:"u-role"},[["investigator","Investigator"],["member","Team member"]].map(([v,l])=>h("option",{value:v},l)));
  role.value = u.role; role.addEventListener("change",()=>u.role=role.value);
  const pw = h("input",{type:"password",id:"u-pw",autocomplete:"new-password"});
  pw.addEventListener("input",()=>u.password=pw.value);
  const checks = data.components.map((c,i)=>{
    const cb = h("input",{type:"checkbox"});
    cb.checked = u.components.includes(c.id);
    cb.addEventListener("change",()=>{ u.components = cb.checked ? [...u.components,c.id] : u.components.filter(x=>x!==c.id); });
    return h("label",{class:"chk"},cb,`${i+1}. ${c.title}`);
  });
  const save = h("button",{class:"primary",type:"button",onclick:async()=>{
    save.disabled=true; err.className="msg"; err.textContent="Saving…";
    try{
      users=(await api("/api/admin/users",{method:"POST",body:JSON.stringify({action:"save",user:u})})).users;
      editing=null; drawUsers(box);
    }catch(ex){ err.className="msg err"; err.textContent=ex.message; save.disabled=false; }
  }},isNew?"Create login":"Save login");
  return h("div",{class:"panel"},
    h("h2",{},isNew?"New login":"Edit login"),
    h("div",{class:"two"},
      textField("Full name",()=>u.name,v=>u.name=v),
      textField("Login ID (cannot be changed later)",()=>u.username,v=>u.username=v,false,!isNew)),
    h("div",{class:"two"},
      h("div",{},h("label",{for:"u-role"},"Role"),role),
      h("div",{},h("label",{for:"u-pw"},isNew?"Password (min 6 characters)":"New password (leave blank to keep the current one)"),pw)),
    h("div",{class:"grp"},h("h4",{},"Components this person can edit"),checks),
    h("div",{style:"margin-top:14px;display:flex;gap:10px"},save,h("button",{type:"button",onclick:()=>{editing=null;drawUsers(box);}},"Cancel")),
    err);
}

/* ---------- Activity log (admin only) ---------- */
async function showLog(){
  const box = document.getElementById("tabbox");
  try{
    const log = await api("/api/admin/log");
    if(!log.length){ box.replaceChildren(h("p",{class:"empty"},"No activity recorded yet.")); return; }
    box.replaceChildren(...log.map(e=>h("div",{class:"log"},
      h("div",{}, h("span",{class:"who"},e.user), " ", h("span",{class:"when"},new Date(e.time).toLocaleString())),
      h("ul",{},e.changes.map(c=>h("li",{},c))))));
  }catch(ex){ box.replaceChildren(h("p",{class:"msg err"},ex.message)); }
}

if (token) {
  api("/api/admin/me").then(p=>{ me = p; sessionStorage.setItem("hri_me",JSON.stringify(me)); return load(); }).catch(()=>showLogin());
} else showLogin();
</script>
</body>
</html>
