<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hospital-based surveillance and Cohort study of heat related illnesses in India</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
  <div id="bubbles" aria-hidden="true"></div>
  <div id="sun" class="sun" aria-hidden="true"></div>
  <div class="hero-in">
    <svg class="thermo" viewBox="0 0 60 140" aria-hidden="true">
      <rect x="20" y="4" width="20" height="104" rx="10" fill="#fff" fill-opacity=".95"/>
      <circle cx="30" cy="116" r="21" fill="#fff" fill-opacity=".95"/>
      <circle cx="30" cy="116" r="13" fill="#e03a2f"/>
      <rect class="mercury" x="26" y="16" width="8" height="100" rx="4" fill="#e03a2f"/>
      <g stroke="#b9c2c9" stroke-width="2" stroke-linecap="round"><line x1="44" y1="24" x2="52" y2="24"/><line x1="44" y1="44" x2="52" y2="44"/><line x1="44" y1="64" x2="52" y2="64"/><line x1="44" y1="84" x2="52" y2="84"/></g>
    </svg>
    <h1>Hospital-based surveillance and Cohort study of heat related illnesses in India</h1>
  </div>
  <svg class="waves" viewBox="0 0 2880 70" preserveAspectRatio="none" aria-hidden="true">
    <path class="w1" fill="#fff7ec" fill-opacity=".55" d="M0 35 Q180 0 360 35 T720 35 T1080 35 T1440 35 T1800 35 T2160 35 T2520 35 T2880 35 V70 H0Z"/>
    <path class="w2" fill="#fff7ec" d="M0 48 Q180 18 360 48 T720 48 T1080 48 T1440 48 T1800 48 T2160 48 T2520 48 T2880 48 V70 H0Z"/>
  </svg>
</header>

<main class="wrap" id="app" aria-live="polite">
  <p class="empty">Loading…</p>
</main>

<footer>
  <span class="f-ico"><svg id="fsun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"></svg>Developed by HRI Team, ICMR NIE</span>
  <a href="admin.html">Admin login</a>
</footer>

<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

/* ---- icons (24x24 line icons) ---- */
const svg = (inner, cls="ico") => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
const ICON = {
  target: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
  flag: '<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/>',
  heart: '<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/><polyline points="7 12 9.5 12 11 9 13 15 14.5 12 17 12"/>',
  wind: '<path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/>',
  shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/>',
  bell: '<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',
  user: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
  pulse: '<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>',
  clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>',
  thermo: '<path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>'
};
const badgeIco = (name) => `<span class="ico-badge">${svg(ICON[name],"")}</span>`;
const COMP = {
  epi:           {icon:"heart",  c1:"#e03a2f", c2:"#f58220"},
  climate:       {icon:"wind",   c1:"#1d6fb8", c2:"#13a89e"},
  interventions: {icon:"shield", c1:"#12794a", c2:"#13a89e"},
  ews:           {icon:"bell",   c1:"#b45309", c2:"#d97706"}
};

/* ---- decorative hero bits ---- */
document.getElementById("fsun").innerHTML = ICON.sun;
document.getElementById("sun").innerHTML = (() => {
  let rays = ""; for (let i=0;i<16;i++) rays += `<line x1="100" y1="16" x2="100" y2="${i%2?30:8}" transform="rotate(${i*22.5} 100 100)"/>`;
  return `<svg viewBox="0 0 200 200"><g stroke="#fff3b0" stroke-width="6" stroke-linecap="round">${rays}</g>
    <circle class="core" cx="100" cy="100" r="46" fill="#fff3b0" fill-opacity=".9"/><circle cx="100" cy="100" r="62" fill="none" stroke="#fff3b0" stroke-opacity=".5" stroke-width="3"/></svg>`;
})();
document.getElementById("bubbles").innerHTML = Array.from({length:14},(_,i)=>{
  const s = 8 + Math.random()*22;
  return `<span class="bubble" style="left:${Math.random()*100}%;width:${s}px;height:${s}px;animation-duration:${6+Math.random()*8}s;animation-delay:${-Math.random()*10}s"></span>`;
}).join("");

/* ---- helpers ---- */
const fmtMonth = v => /^\d{4}-\d{2}$/.test(v||"") ? `<span class="date-chip">${svg(ICON.calendar,"")}${MONTHS[+v.slice(5)-1]} ${v.slice(0,4)}</span>` : "—";
const badge = s => {
  const cls = s === "Completed" ? "completed" : s === "Not Completed" ? "not" : "proc";
  return `<span class="badge ${cls}">${esc(s)}</span>`;
};
function table(headers, rows, emptyText){
  if(!rows.length) return `<p class="empty">${emptyText}</p>`;
  return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th class="${h.cls||""}">${h.t}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
}

function render(d){
  const comps = d.components.map((c,i) => {
    const t = COMP[c.id] || COMP.epi;
    const inv = c.investigator;
    const invHtml = (inv.name || inv.designation)
      ? `<span class="n">${esc(inv.name)}</span>${inv.designation?`<span class="d">${esc(inv.designation)}</span>`:""}`
      : `<span class="d">Not yet assigned</span>`;
    const done = c.activities.filter(a=>a.status==="Completed").length, total = c.activities.length;
    const pct = total ? Math.round(done/total*100) : 0;
    const prog = total ? `<div class="progress"><span>${done} of ${total} completed</span><div class="track"><div class="fill" data-w="${pct}"></div></div><span>${pct}%</span></div>` : "";
    const acts = table(
      [{t:"Project activities"},{t:"Status"}],
      c.activities.map(a=>`<tr><td>${esc(a.activity)}</td><td>${badge(a.status)}</td></tr>`),
      "No project activities added yet.");
    const up = table(
      [{t:"Upcoming activities"},{t:"End date",cls:"date"}],
      c.upcoming.map(a=>`<tr><td>${esc(a.activity)}</td><td class="date">${fmtMonth(a.endDate)}</td></tr>`),
      "No upcoming activities added yet.");
    return `<section class="component reveal" style="--c1:${t.c1};--c2:${t.c2};transition-delay:${i*60}ms" aria-label="${esc(c.title)}">
      <header>${badgeIco(t.icon)}<h3>${esc(c.title)}</h3></header>
      <div class="body">
        <div class="invest">${svg(ICON.user,"")}<span class="k">Investigator in-charge</span>${invHtml}</div>
        ${prog}
        <div class="tables">
          <div><p class="tbl-title">${svg(ICON.pulse,"small-ico")}Project activities</p>${acts}</div>
          <div><p class="tbl-title">${svg(ICON.clock,"small-ico")}Upcoming activities</p>${up}</div>
        </div>
      </div></section>`;
  }).join("");

  const pubs = table(
    [{t:"Activity"},{t:"Status"},{t:"End date",cls:"date"}],
    d.publications.map(a=>`<tr><td>${esc(a.activity)}</td><td>${badge(a.status)}</td><td class="date">${fmtMonth(a.endDate)}</td></tr>`),
    "No activities added yet.");

  document.getElementById("app").innerHTML = `
    <div class="split">
      <section class="panel aim reveal"><h2>${badgeIco("target")}Aim</h2><p>${esc(d.aim)}</p></section>
      <section class="panel obj reveal" style="transition-delay:80ms"><h2>${badgeIco("flag")}Objective</h2>
        <h3>${svg(ICON.thermo,"small-ico")}a) Primary</h3><p>${esc(d.objectives.primary)}</p>
        <h3>${svg(ICON.thermo,"small-ico")}b) Secondary</h3><p>${esc(d.objectives.secondary)}</p>
      </section>
    </div>
    <h2 class="section-title reveal">${badgeIco("thermo")}Components</h2>
    ${comps}
    <h2 class="section-title reveal">${badgeIco("file")}Other activities for publication</h2>
    <div class="panel reveal">${pubs}</div>`;

  const els = document.querySelectorAll(".reveal");
  if (!("IntersectionObserver" in window)) { els.forEach(e=>{e.classList.add("in");fillBars(e);}); return; }
  const io = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ e.target.classList.add("in"); fillBars(e.target); io.unobserve(e.target);} }), {threshold:.12});
  els.forEach(e => io.observe(e));
}
function fillBars(root){ root.querySelectorAll(".fill").forEach(f => f.style.width = f.dataset.w + "%"); }

fetch("/api/content").then(r => { if(!r.ok) throw 0; return r.json(); })
  .then(render)
  .catch(() => { document.getElementById("app").innerHTML = '<p class="empty">Could not load the project details. Please refresh the page.</p>'; });
</script>
</body>
</html>
